<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sort() - Métodos de arrays</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <header class="barra-superior">
    <div>
      <h1>sort()</h1>
      <p>Ordena los elementos de un array (modifica el original)</p>
    </div>
    <button id="btnTema" class="tema">Modo oscuro</button>
  </header>

  <main class="grilla">
      <article class="tarjeta">
        <h2>Ejercicio 1</h2>
        <p class="consigna">Ordena un array de números de menor a mayor.</p>
        <div class="controles">
          <input type="number" id="numero1" placeholder="Agregar un número" value="">
          <button id="agregar1" class="secundario">Agregar</button>
          <button id="ordenar1">Ordenar con sort()</button>
          <button id="reiniciar1" class="secundario">Reiniciar</button>
        </div>
        <p class="etiqueta">Array</p>
        <div class="arreglo" id="arr1"></div>
        <p class="resultado" id="res1"></p>
      </article>
      <article class="tarjeta">
        <h2>Ejercicio 2</h2>
        <p class="consigna">Ordena un array de palabras alfabéticamente.</p>
        <div class="controles">
          <input type="text" id="palabra2" placeholder="Agregar una palabra" value="">
          <button id="agregar2" class="secundario">Agregar</button>
          <button id="ordenar2">Ordenar A-Z</button>
          <button id="reiniciar2" class="secundario">Reiniciar</button>
        </div>
        <p class="etiqueta">Array</p>
        <div class="arreglo" id="arr2"></div>
        <p class="resultado" id="res2"></p>
      </article>
      <article class="tarjeta">
        <h2>Ejercicio 3</h2>
        <p class="consigna">Dado un array de objetos {nombre, edad}, ordénalos por edad.</p>
        <div class="controles">
          <input type="text" id="nombre3" placeholder="Nombre" value="">
          <input type="number" id="edad3" placeholder="Edad" value="">
          <button id="agregar3" class="secundario">Agregar</button>
          <button id="ordenar3">Ordenar por edad</button>
          <button id="reiniciar3" class="secundario">Reiniciar</button>
        </div>
        <p class="etiqueta">Array</p>
        <div class="arreglo" id="arr3"></div>
        <p class="resultado" id="res3"></p>
      </article>
  </main>

  <script src="/modules/script.js"></script>
</body>
</html>
