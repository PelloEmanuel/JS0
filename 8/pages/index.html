<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>includes() - Métodos de arrays</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <header class="barra-superior">
    <div>
      <h1>includes()</h1>
      <p>Comprueba si un array contiene un valor (true o false)</p>
    </div>
    <button id="btnTema" class="tema">Modo oscuro</button>
  </header>

  <main class="grilla">
      <article class="tarjeta">
        <h2>Ejercicio 1</h2>
        <p class="consigna">Comprueba si un array contiene la palabra "admin".</p>
        <div class="controles">
          <input type="text" id="palabra1" placeholder="Palabra" value="admin">
          <button id="comprobar1">Comprobar con includes()</button>
          <button id="reiniciar1" class="secundario">Reiniciar</button>
        </div>
        <p class="etiqueta">Array</p>
        <div class="arreglo" id="arr1"></div>
        <p class="resultado" id="res1"></p>
      </article>
      <article class="tarjeta">
        <h2>Ejercicio 2</h2>
        <p class="consigna">Dado un array de colores, indica si existe "verde".</p>
        <div class="controles">
          <input type="text" id="color2" placeholder="Color" value="verde">
          <button id="comprobar2">Comprobar con includes()</button>
          <button id="reiniciar2" class="secundario">Reiniciar</button>
        </div>
        <p class="etiqueta">Array</p>
        <div class="arreglo" id="arr2"></div>
        <p class="resultado" id="res2"></p>
      </article>
      <article class="tarjeta">
        <h2>Ejercicio 3</h2>
        <p class="consigna">Verifica si un número está presente antes de sumarlo al array.</p>
        <div class="controles">
          <input type="number" id="numero3" placeholder="Número" value="">
          <button id="sumar3">Sumar si no está</button>
          <button id="reiniciar3" class="secundario">Reiniciar</button>
        </div>
        <p class="etiqueta">Array</p>
        <div class="arreglo" id="arr3"></div>
        <p class="resultado" id="res3"></p>
      </article>
  </main>

  <script src="/modules/script.js"></script>
</body>
</html>
